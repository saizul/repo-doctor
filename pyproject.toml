[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-doctor"
dynamic = ["version"]
description = "Check any Git repository for open-source best practices (README, LICENSE, CI, security policy, secrets, broken links, package metadata), get a 0-100 score and scaffold what is missing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saizul Amin" }]
keywords = ["open-source", "linter", "repository", "best-practices", "github", "github-actions", "sarif", "community-health"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.17.5"]

[project.urls]
Homepage = "https://github.com/saizul/repo-doctor"
Issues = "https://github.com/saizul/repo-doctor/issues"
Changelog = "https://github.com/saizul/repo-doctor/blob/main/CHANGELOG.md"

[project.scripts]
repo-doctor = "repo_doctor.cli:main"

[tool.setuptools.dynamic]
version = { attr = "repo_doctor._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repo_doctor = ["py.typed", "templates/*", "templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["*.md", "src/repo_doctor/templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["SIM108", "RUF022", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.repo-doctor]
large_file_mb = 2

[tool.repo-doctor.links]
# Templates contain links that only resolve once they are copied into a project.
ignore = ["src/repo_doctor/templates/**"]
