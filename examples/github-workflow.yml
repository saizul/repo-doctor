# .github/workflows/repo-doctor.yml
# Runs repo-doctor on every pull request, writes a job summary and uploads
# the findings to GitHub code scanning.
name: repo-doctor

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: doctor
        uses: saizul/repo-doctor@v0.1.0
        with:
          fail-under: "80"
          fail-on: high
          sarif-file: repo-doctor.sarif
      - name: Upload to code scanning
        if: always() && hashFiles('repo-doctor.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: repo-doctor.sarif
          category: repo-doctor
      - run: echo "Health score ${{ steps.doctor.outputs.score }} / 100 (${{ steps.doctor.outputs.grade }})"
